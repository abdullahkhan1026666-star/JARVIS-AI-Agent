
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JARVIS AI</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#050b16;color:#eaf5ff;
 font-family:Arial,sans-serif;min-height:100vh;
 display:flex;justify-content:center;align-items:center;
 padding:18px;
}
.app{
 width:100%;max-width:480px;min-height:85vh;
 background:#0c1728;border:1px solid #174b69;
 border-radius:22px;padding:22px;
 box-shadow:0 0 30px #00c8ff22;
 display:flex;flex-direction:column;
}
h1{text-align:center;color:#40dfff;letter-spacing:5px}
.orb{
 width:125px;height:125px;border-radius:50%;
 margin:15px auto;background:radial-gradient(circle,#b8ffff,#00a5d8 35%,#07334f 70%);
 box-shadow:0 0 35px #00cfff;
}
.status{text-align:center;color:#70dfff;font-size:14px}
#chat{
 flex:1;min-height:220px;max-height:45vh;overflow:auto;
 margin:20px 0;padding:12px;background:#07101e;
 border-radius:14px;
}
.msg{padding:12px;margin:9px 0;border-radius:12px;line-height:1.5}
.bot{background:#12304a;color:#c9f5ff}
.user{background:#174c65;text-align:right}
.controls{display:flex;gap:8px}
input{
 flex:1;min-width:0;padding:14px;border-radius:12px;
 border:1px solid #28718e;background:#07101e;color:white;
 font-size:16px;
}
button{
 border:0;border-radius:12px;padding:13px;
 background:#00a9d6;color:white;font-weight:bold;
}
.mic{margin-top:12px;width:100%;background:#15516b}
small{color:#89a9bb;text-align:center;margin-top:14px}
</style>
</head>
<body>
<div class="app">
<h1>J.A.R.V.I.S</h1>
<div class="orb"></div>
<div class="status" id="status">SYSTEM ONLINE</div>
<div id="chat">
 <div class="msg bot">Hello! I am JARVIS. How can I help you?</div>
</div>
<div class="controls">
 <input id="message" placeholder="Ask JARVIS anything...">
 <button onclick="sendMessage()">SEND</button>
</div>
<button class="mic" onclick="listen()">🎤 SPEAK TO JARVIS</button>
<small>Personal AI Assistant • Version 1.0</small>
</div>
<script>
const chat=document.getElementById("chat");
const input=document.getElementById("message");
const statusText=document.getElementById("status");

function addMessage(text,type){
 const div=document.createElement("div");
 div.className="msg "+type;
 div.textContent=text;
 chat.appendChild(div);
 chat.scrollTop=chat.scrollHeight;
}
function speak(text){
 if("speechSynthesis" in window){
  speechSynthesis.cancel();
  const voice=new SpeechSynthesisUtterance(text);
  voice.lang="en-US";
  speechSynthesis.speak(voice);
 }
}
function sendMessage(){
 const text=input.value.trim();
 if(!text)return;
 addMessage(text,"user");
 input.value="";
 let reply="I am ready to help. My AI brain will be connected in the next step.";
 const q=text.toLowerCase();
 if(q.includes("hello")||q.includes("hi"))reply="Hello! Nice to meet you. I am JARVIS.";
 else if(q.includes("your name"))reply="My name is JARVIS, your personal assistant.";
 else if(q.includes("time"))reply="The current time is "+new Date().toLocaleTimeString();
 else if(q.includes("date"))reply="Today's date is "+new Date().toLocaleDateString();
 setTimeout(()=>{
  addMessage(reply,"bot");
  speak(reply);
 },400);
}
input.addEventListener("keydown",e=>{
 if(e.key==="Enter")sendMessage();
});
function listen(){
 const Speech=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!Speech){
  statusText.textContent="VOICE NOT SUPPORTED IN THIS BROWSER";
  return;
 }
 const recognition=new Speech();
 recognition.lang="en-US";
 recognition.onstart=()=>statusText.textContent="LISTENING...";
 recognition.onresult=e=>{
  input.value=e.results[0][0].transcript;
  sendMessage();
 };
 recognition.onerror=()=>statusText.textContent="VOICE ERROR - TRY AGAIN";
 recognition.onend=()=>statusText.textContent="SYSTEM ONLINE";
 recognition.start();
}
</script>
</body>
</html>
